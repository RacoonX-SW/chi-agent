[project]
name = "chi-agent"
version = "0.1.0"
description = "CHI-Bench Workflow Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml==6.0.3",
    "pydantic==2.14.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
