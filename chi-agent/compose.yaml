services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: chi-agent-dev:latest
    container_name: chi-agent-dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    command: ["python3", "-m", "unittest", "discover", "-s", "tests", "-v"]
