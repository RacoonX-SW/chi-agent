services:
  a-control:
    build:
      context: .
      dockerfile: docker/a/Dockerfile
    image: chi-agent-a-control:latest
    working_dir: /workspace
    environment:
      A_PROJECT_ROOT: /workspace
      HOST_PROJECT_ROOT: ${PWD}
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - ./scripts/a_environment.py:/workspace/scripts/a_environment.py:ro
      - ./scripts/a_tools_probe.py:/workspace/scripts/a_tools_probe.py:ro
      - ./docker/a:/workspace/docker/a:rw
      - ./vendor:/workspace/vendor:ro
      - ./data:/workspace/data:rw
      - ./runs:/workspace/runs:rw
      - ${DOCKER_HOST_SOCKET:-/Users/asaki/.docker/run/docker.sock}:/var/run/docker.sock
    command: ["sleep", "infinity"]
