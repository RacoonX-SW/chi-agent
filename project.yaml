project: chi-agent
description: >
  CHI Workflow Agent — non-commercial research prototype for healthcare
  administrative workflows.  Targets the chi-bench Kaggle competition.
  Initial state: environment and baseline only; no custom agent yet.

upstream:
  repository: https://github.com/actava-ai/chi-bench
  pinned_commit: 4444a07fa68a4f1623f841a292a54e284fc8e7f7
  version: 1.1.0
  vendor_dir: vendor/chi-bench
  data_dir: data
  data_version: chi-bench-v1.0.0   # must match data/.chi-bench-version when downloaded

run:
  output_dir: runs
  default_n_tasks: 1
  default_domain: pa_provider        # public domain for single-task baseline
  execution_method: experiment_run    # uses upstream cb experiment run -f <ExperimentConfig>
  default_budget_cny: 5.0
  default_max_rounds: 30
  default_max_tokens_per_request: 8192

secrets:
  # Presence is configuration evidence only; this project has not verified
  # connectivity or successful authentication for any provider.
  runner_provider_environment:
    deepseek: DEEPSEEK_API_KEY
    gemini: GEMINI_API_KEY
    openai: OPENAI_API_KEY
    openrouter: OPENROUTER_API_KEY
    anthropic: ANTHROPIC_API_KEY
  judge_api_key: ANTHROPIC_API_KEY  # configured key path; validity is unverified
  judge_oauth_path: CLAUDE_CODE_OAUTH_TOKEN  # known upstream path; not verified here

handbook:
  dataset: actava/managed-care-operations-handbook
  access_url: https://huggingface.co/datasets/actava/managed-care-operations-handbook
  status: DOWNLOADED_VERIFIED    # authenticated download and remote size checks, 2026-10-20
  revision: f1210b294904792541116852f6074df8b84d89dd
  download_verified: true
